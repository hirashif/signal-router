[project]
name = "signal-router"
version = "0.1.0"
description = "Route new signups into HubSpot: enrich, score, assign an owner, create the follow-up task, alert Slack, reconcile nightly."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
signal-router = "signal_router.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["signal_router*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
